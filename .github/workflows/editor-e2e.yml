# OpenRAC's Assets dock end to end on this editor: builds the editor (no LTO, SCons cache), then runs
# OpenRAC's editor/test_editor_e2e.py and the other editor tests that need Godot. The fork's own
# changes (the 3D view's drop hook, the MCP server) are what the dock leans on.
name: editor-e2e

on:
  pull_request:
    paths-ignore: ["mods/**", "docs/**", "**.md"]
  push:
    branches: [main, master]
    paths-ignore: ["mods/**", "docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      openrac-ref:
        description: OpenRAC branch or tag whose editor tests run
        default: develop

permissions:
  contents: read

concurrency:
  group: editor-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenRAC/OpenRAC
          ref: ${{ inputs.openrac-ref || 'develop' }}
          path: openrac
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends build-essential pkg-config
          python -m pip install -q scons

      # One cache per commit, restored from the newest one, so only changed files compile.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: editor-e2e-scons-${{ github.sha }}
          restore-keys: editor-e2e-scons-

      # The release profile without LTO, which only makes the build slower here.
      - name: Build the editor
        run: |
          scons platform=linuxbsd profile=build/custom.py production=no lto=none optimize=speed \
            wayland=no cache_path="$RUNNER_TEMP/scons-cache" cache_limit=4 -j"$(nproc)"
          echo "OPENRAC_GODOT=$PWD/bin/godot.linuxbsd.editor.x86_64" >> "$GITHUB_ENV"

      - name: Assets dock end to end, and the editor tests that run Godot
        working-directory: openrac/editor
        run: |
          if [ ! -f test_editor_e2e.py ]; then
            echo "::notice::this OpenRAC ref has no editor e2e yet"
          fi
          python -m unittest discover -s . -v
